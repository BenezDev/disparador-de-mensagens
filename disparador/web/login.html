<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Disparador — acesso</title>
<style>
  :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#0d0d0d;color:#eee}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
  main{width:min(420px,100%);border-top:2px solid #771c27;padding:32px 0}
  h1{font-size:25px;letter-spacing:-.04em;margin:0 0 8px}p{color:#999;line-height:1.5;margin:0 0 24px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#aaa;margin-bottom:8px}
  input{width:100%;background:#171717;border:1px solid #333;border-radius:4px;color:#fff;padding:13px;font:inherit}
  button{width:100%;margin-top:12px;border:0;border-radius:4px;padding:13px;background:#8d2633;color:#fff;font-weight:700;cursor:pointer}
  #erro{min-height:22px;margin-top:14px;color:#e88994;font-size:13px}
</style>
<main>
  <h1>Painel protegido</h1>
  <p>Use a chave local gravada em <code>.painel-chave</code>. Ela nunca sai desta máquina.</p>
  <form id="f"><label for="token">Chave de acesso</label><input id="token" type="password" autocomplete="current-password" autofocus><button>Entrar</button></form>
  <div id="erro"></div>
</main>
<script>
f.addEventListener("submit",async e=>{e.preventDefault();erro.textContent="";try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:token.value})});const d=await r.json();if(!r.ok)throw Error(d.erro||"acesso negado");location.replace("/")}catch(e){erro.textContent=e.message}})
</script>
</html>
